          make_latest: ${{ env.IS_STABLE == 'true' && 'legacy' || 'false' }}
          files: |
            loong64-artifacts/**

  sync-registry:
    if: startsWith(github.ref, 'refs/tags/') && vars.SYNC_REGISTRY != ''
    needs: [build, build-git]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      DOCKER_TAG: ${{ needs.build.outputs.DOCKER_TAG }}
      GRADLE_VERSION: ${{ needs.build.outputs.GRADLE_VERSION }}
    steps:
      - name: Download container images
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: gradle-loong64*image-*
          path: loong64-artifacts
          merge-multiple: true

      - name: Load Docker images
        run: |
          for tar in loong64-artifacts/gradle-loong64-*.tar; do
            echo "=== Loading $tar ==="
            docker load -i "$tar"
          done
          echo "=== After load ==="
          docker images

      - name: Login to sync container registry
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: ${{ vars.SYNC_REGISTRY }}
          username: ${{ vars.SYNC_REGISTRY_USERNAME }}
          password: ${{ secrets.SYNC_REGISTRY_PASSWORD }}

      - name: Sync Docker images to sync container registry
        run: |
          for tar in loong64-artifacts/gradle-loong64-*.tar; do
            filename=$(basename "$tar" .tar)
            # Remove DOCKER_TAG prefix to get the image tag
            suffix=$(echo "$filename" | sed "s/gradle-loong64-git-${{ env.DOCKER_TAG }}-//" | sed "s/gradle-loong64-${{ env.DOCKER_TAG }}-//")

            if echo "$filename" | grep -q "^gradle-loong64-git-"; then
              IMAGE_REF=${{ env.NAMESPACE }}/gradle-loong64:${suffix}-git
            else
              IMAGE_REF=${{ env.NAMESPACE }}/gradle-loong64:${suffix}
            fi

            SYNC_IMAGE_REF=${{ vars.SYNC_REGISTRY }}/${{ env.NAMESPACE }}/gradle-loong64:${suffix}
            if echo "$filename" | grep -q "^gradle-loong64-git-"; then
              SYNC_IMAGE_REF=${{ vars.SYNC_REGISTRY }}/${{ env.NAMESPACE }}/gradle-loong64:${suffix}-git
            fi

            echo "=== Syncing $IMAGE_REF -> $SYNC_IMAGE_REF ==="
            docker tag "$IMAGE_REF" "$SYNC_IMAGE_REF"
            docker push "$SYNC_IMAGE_REF"
          done
          echo "=== Registry sync complete ==="
