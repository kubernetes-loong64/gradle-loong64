name: loong64
on:
  workflow_dispatch:
  push:
    branches:
      - loong64-*
    tags:
      - release-loong64-*
  pull_request:
    branches:
      - loong64-*

env:
  NAMESPACE: ${{ vars.NAMESPACE || 'kubernetesloong64' }}

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      DOCKER_TAG: ${{ steps.extract.outputs.DOCKER_TAG }}
      GRADLE_VERSION: ${{ steps.extract.outputs.GRADLE_VERSION }}
      IS_STABLE: ${{ steps.extract.outputs.IS_STABLE }}
    strategy:
      fail-fast: false
      matrix:
        base:
          - os: anolis
            dockerfile: Dockerfile.anolis
          - os: debian
            dockerfile: Dockerfile.debian
          - os: debian-slim
            dockerfile: Dockerfile.debian
        jdk:
          - version: "8"
          - version: "11"
          - version: "17"
          - version: "21"
          - version: "25"
          - version: "26"
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Print branch name
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "${{ github.base_ref }} (PR target)"
          else
            echo ${{ github.ref_name }}
          fi

      - name: Extract git branch
        id: extract
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            REF=${{ github.base_ref }}
          else
            REF=${{ github.ref_name }}
          fi
          echo "REF=$REF"
          RAW_VERSION=$(echo $REF | awk -F'loong64-' '{print $2}')
          echo "RAW_VERSION=$RAW_VERSION"
          echo "RAW_VERSION=$RAW_VERSION" >> ${GITHUB_ENV}
          DOCKER_TAG=$(echo $RAW_VERSION | sed 's/+/-/g')
          echo "DOCKER_TAG=$DOCKER_TAG"
          echo "DOCKER_TAG=$DOCKER_TAG" >> ${GITHUB_ENV}
          echo "DOCKER_TAG=$DOCKER_TAG" >> ${GITHUB_OUTPUT}
          GRADLE_VERSION=$(echo $RAW_VERSION | awk -F'+' '{print $1}')
          echo "GRADLE_VERSION=$GRADLE_VERSION"
          echo "GRADLE_VERSION=$GRADLE_VERSION" >> ${GITHUB_ENV}
          echo "GRADLE_VERSION=$GRADLE_VERSION" >> ${GITHUB_OUTPUT}
          if echo "$RAW_VERSION" | grep -qE '[+].*(alpha|beta|rc)'; then
            IS_STABLE=false
          else
            IS_STABLE=true
          fi
          echo "IS_STABLE=$IS_STABLE"
          echo "IS_STABLE=$IS_STABLE" >> ${GITHUB_OUTPUT}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@06116385d9baf250c9f4dcb4858b16962ea869c3 # v4.1.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0

      - name: Build Docker image
        run: |
          IMAGE_REF=${{ env.NAMESPACE }}/gradle-loong64:${{ env.GRADLE_VERSION }}-${{ matrix.jdk.version }}-${{ matrix.base.os }}
          TAR_FILE=gradle-loong64-${{ env.DOCKER_TAG }}-${{ env.GRADLE_VERSION }}-${{ matrix.jdk.version }}-${{ matrix.base.os }}.tar
          echo "=== Before Docker build ==="
          docker images
          echo "=== Starting Docker build ==="
          docker buildx build \
            --no-cache \
            -f "docker/${{ matrix.base.dockerfile }}" \
            --load \
            --build-arg "JDK_VERSION=${{ matrix.jdk.version }}" \
            --build-arg "GRADLE_VERSION=${{ env.GRADLE_VERSION }}" \
            --build-arg "OS=${{ matrix.base.os }}" \
            --platform linux/loong64 \
            -t "$IMAGE_REF" \
            docker/
          echo "=== After build ==="
          docker images
          echo "=== Saving $IMAGE_REF ==="
          docker save -o "$TAR_FILE" "$IMAGE_REF"
          echo "=== Image tarball ==="
          ls -lha "$TAR_FILE"
          echo "=== Manifest ==="
          echo "--- repositories ---"
          tar -xOf "$TAR_FILE" repositories
          echo "--- manifest.json ---"
          tar -xOf "$TAR_FILE" manifest.json | jq
          echo "--- config ---"
          tar -xOf "$TAR_FILE" $(tar -xOf "$TAR_FILE" manifest.json | jq -r '.[0].Config') | jq
          echo "--- os, architecture ---"
          tar -xOf "$TAR_FILE" $(tar -xOf "$TAR_FILE" manifest.json | jq -r '.[0].Config') | jq '{os, architecture}'

      - name: Upload container image
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gradle-loong64-image-${{ env.GRADLE_VERSION }}-${{ matrix.jdk.version }}-${{ matrix.base.os }}
          path: gradle-loong64-${{ env.DOCKER_TAG }}-${{ env.GRADLE_VERSION }}-${{ matrix.jdk.version }}-${{ matrix.base.os }}.tar

  build-git:
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    env:
      DOCKER_TAG: ${{ needs.build.outputs.DOCKER_TAG }}
      GRADLE_VERSION: ${{ needs.build.outputs.GRADLE_VERSION }}
    strategy:
      fail-fast: false
      matrix:
        git_version: [ "v2.54.0" ]
        base:
          - os: anolis
            dockerfile: Dockerfile.anolis.git
          - os: debian
            dockerfile: Dockerfile.debian.git
          - os: debian-slim
            dockerfile: Dockerfile.debian.git
        jdk:
          - version: "8"
          - version: "11"
          - version: "17"
          - version: "21"
          - version: "25"
          - version: "26"
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Download base gradle image
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: gradle-loong64-image-${{ env.GRADLE_VERSION }}-${{ matrix.jdk.version }}-${{ matrix.base.os }}
          path: base-image

      - name: Load base image
        run: |
          echo "=== Loading base gradle image ==="
          docker load -i base-image/*.tar
          echo "=== After load ==="
          docker images

      - name: Set up QEMU
        uses: docker/setup-qemu-action@06116385d9baf250c9f4dcb4858b16962ea869c3 # v4.1.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0
        with:
          driver: docker

      - name: Build git image
        run: |
          IMAGE_REF=${{ env.NAMESPACE }}/gradle-loong64:${{ env.GRADLE_VERSION }}-${{ matrix.jdk.version }}-${{ matrix.base.os }}-git
          TAR_FILE=gradle-loong64-git-${{ env.DOCKER_TAG }}-${{ env.GRADLE_VERSION }}-${{ matrix.jdk.version }}-${{ matrix.base.os }}.tar
          echo "=== Before Docker build ==="
          docker images
          echo "=== Starting Docker build ==="
          docker buildx build \
            --no-cache \
            -f "docker/${{ matrix.base.dockerfile }}" \
            --load \
            --build-arg "JDK_VERSION=${{ matrix.jdk.version }}" \
            --build-arg "GRADLE_VERSION=${{ env.GRADLE_VERSION }}" \
            --build-arg "GIT_VERSION=${{ matrix.git_version }}" \
            --build-arg "OS=${{ matrix.base.os }}" \
            --platform linux/loong64 \
            -t "$IMAGE_REF" \
            docker/
          echo "=== After build ==="
          docker images
          echo "=== Saving $IMAGE_REF ==="
          docker save -o "$TAR_FILE" "$IMAGE_REF"
          echo "=== Image tarball ==="
          ls -lha "$TAR_FILE"
          echo "=== Manifest ==="
          echo "--- repositories ---"
          tar -xOf "$TAR_FILE" repositories
          echo "--- manifest.json ---"
          tar -xOf "$TAR_FILE" manifest.json | jq
          echo "--- config ---"
          tar -xOf "$TAR_FILE" $(tar -xOf "$TAR_FILE" manifest.json | jq -r '.[0].Config') | jq
          echo "--- os, architecture ---"
          tar -xOf "$TAR_FILE" $(tar -xOf "$TAR_FILE" manifest.json | jq -r '.[0].Config') | jq '{os, architecture}'

      - name: Upload container image
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gradle-loong64-git-image-${{ env.GRADLE_VERSION }}-${{ matrix.jdk.version }}-${{ matrix.base.os }}
          path: gradle-loong64-git-${{ env.DOCKER_TAG }}-${{ env.GRADLE_VERSION }}-${{ matrix.jdk.version }}-${{ matrix.base.os }}.tar

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [build, build-git]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      BASE_URL: https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}
      DOCKER_TAG: ${{ needs.build.outputs.DOCKER_TAG }}
      GRADLE_VERSION: ${{ needs.build.outputs.GRADLE_VERSION }}
      IS_STABLE: ${{ needs.build.outputs.IS_STABLE }}
    steps:
      - name: Download container images
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: gradle-loong64*image-*
          path: loong64-artifacts
          merge-multiple: true

      - name: List downloaded files
        run: find . -type f

      - name: Login to Docker
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          username: ${{ vars.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Load and push Docker images
        run: |
          echo "=== Loading images ==="
          for tar in loong64-artifacts/gradle-loong64-*.tar; do
            echo "=== Loading $tar ==="
            docker load -i "$tar"
          done
          echo "=== After load ==="
          docker images

          echo "=== Pushing images ==="
          for tar in loong64-artifacts/gradle-loong64-*.tar; do
            filename=$(basename "$tar" .tar)
            # Remove DOCKER_TAG prefix to get the image tag
            # Format: gradle-loong64-$DOCKER_TAG-$gradle-$jdk-$os → $gradle-$jdk-$os
            # Format: gradle-loong64-git-$DOCKER_TAG-$gradle-$jdk-$os → $gradle-$jdk-$os-git
            suffix=$(echo "$filename" | sed "s/gradle-loong64-git-${{ env.DOCKER_TAG }}-//" | sed "s/gradle-loong64-${{ env.DOCKER_TAG }}-//")

            if echo "$filename" | grep -q "^gradle-loong64-git-"; then
              IMAGE_REF=${{ env.NAMESPACE }}/gradle-loong64:${suffix}-git
            else
              IMAGE_REF=${{ env.NAMESPACE }}/gradle-loong64:${suffix}
            fi

            echo "=== Pushing $IMAGE_REF ==="
            docker push "$IMAGE_REF"
          done

          echo "=== Push complete ==="

      - name: Import GPG key
        run: |
          echo "${{ secrets.GPG_PRIVATE_KEY_BASE64 }}" | base64 -d | gpg --batch --import > /dev/null
          echo "$(gpg --list-secret-keys --keyid-format LONG | grep -Eo '[A-F0-9]{40}' | head -1):6:" | gpg --import-ownertrust

      - name: Sign artifacts
        run: |
          find loong64-artifacts -type f | while read -r file; do
            gpg --detach-sign --armor "$file"
            echo "Signed: $file"
            gpg --verify "$file".asc "$file"
          done

      - name: Generate release body header
        run: |
          cat > release-body.md <<'BODYEOF'
          ## Artifacts

          | File | Download |
          |------|----------|
          BODYEOF

      - name: Append artifact table to release body
        run: |
          cat >> release-body.md <<'BODYEOF'
          | `gradle-loong64-${{ env.DOCKER_TAG }}-${{ env.GRADLE_VERSION }}-8-anolis.tar` | [gradle-loong64-${{ env.DOCKER_TAG }}-${{ env.GRADLE_VERSION }}-8-anolis.tar](${{ env.BASE_URL }}/gradle-loong64-${{ env.DOCKER_TAG }}-${{ env.GRADLE_VERSION }}-8-anolis.tar) |
          | `gradle-loong64-${{ env.DOCKER_TAG }}-${{ env.GRADLE_VERSION }}-8-debian.tar` | [gradle-loong64-${{ env.DOCKER_TAG }}-${{ env.GRADLE_VERSION }}-8-debian.tar](${{ env.BASE_URL }}/gradle-loong64-${{ env.DOCKER_TAG }}-${{ env.GRADLE_VERSION }}-8-debian.tar) |
          | `gradle-loong64-${{ env.DOCKER_TAG }}-${{ env.GRADLE_VERSION }}-8-debian-slim.tar` | [gradle-loong64-${{ env.DOCKER_TAG }}-${{ env.GRADLE_VERSION }}-8-debian-slim.tar](${{ env.BASE_URL }}/gradle-loong64-${{ env.DOCKER_TAG }}-${{ env.GRADLE_VERSION }}-8-debian-slim.tar) |
          | `gradle-loong64-${{ env.DOCKER_TAG }}-${{ env.GRADLE_VERSION }}-11-anolis.tar` | [gradle-loong64-${{ env.DOCKER_TAG }}-${{ env.GRADLE_VERSION }}-11-anolis.tar](${{ env.BASE_URL }}/gradle-loong64-${{ env.DOCKER_TAG }}-${{ env.GRADLE_VERSION }}-11-anolis.tar) |
          | `gradle-loong64-${{ env.DOCKER_TAG }}-${{ env.GRADLE_VERSION }}-11-debian.tar` | [gradle-loong64-${{ env.DOCKER_TAG }}-${{ env.GRADLE_VERSION }}-11-debian.tar](${{ env.BASE_URL }}/gradle-loong64-${{ env.DOCKER_TAG }}-${{ env.GRADLE_VERSION }}-11-debian.tar) |
          | `gradle-loong64-${{ env.DOCKER_TAG }}-${{ env.GRADLE_VERSION }}-11-debian-slim.tar` | [gradle-loong64-${{ env.DOCKER_TAG }}-${{ env.GRADLE_VERSION }}-11-debian-slim.tar](${{ env.BASE_URL }}/gradle-loong64-${{ env.DOCKER_TAG }}-${{ env.GRADLE_VERSION }}-11-debian-slim.tar) |
          | `gradle-loong64-${{ env.DOCKER_TAG }}-${{ env.GRADLE_VERSION }}-17-anolis.tar` | [gradle-loong64-${{ env.DOCKER_TAG }}-${{ env.GRADLE_VERSION }}-17-anolis.tar](${{ env.BASE_URL }}/gradle-loong64-${{ env.DOCKER_TAG }}-${{ env.GRADLE_VERSION }}-17-anolis.tar) |
          | `gradle-loong64-${{ env.DOCKER_TAG }}-${{ env.GRADLE_VERSION }}-17-debian.tar` | [gradle-loong64-${{ env.DOCKER_TAG }}-${{ env.GRADLE_VERSION }}-17-debian.tar](${{ env.BASE_URL }}/gradle-loong64-${{ env.DOCKER_TAG }}-${{ env.GRADLE_VERSION }}-17-debian.tar) |
          | `gradle-loong64-${{ env.DOCKER_TAG }}-${{ env.GRADLE_VERSION }}-17-debian-slim.tar` | [gradle-loong64-${{ env.DOCKER_TAG }}-${{ env.GRADLE_VERSION }}-17-debian-slim.tar](${{ env.BASE_URL }}/gradle-loong64-${{ env.DOCKER_TAG }}-${{ env.GRADLE_VERSION }}-17-debian-slim.tar) |
          | `gradle-loong64-${{ env.DOCKER_TAG }}-${{ env.GRADLE_VERSION }}-21-anolis.tar` | [gradle-loong64-${{ env.DOCKER_TAG }}-${{ env.GRADLE_VERSION }}-21-anolis.tar](${{ env.BASE_URL }}/gradle-loong64-${{ env.DOCKER_TAG }}-${{ env.GRADLE_VERSION }}-21-anolis.tar) |
          | `gradle-loong64-${{ env.DOCKER_TAG }}-${{ env.GRADLE_VERSION }}-21-debian.tar` | [gradle-loong64-${{ env.DOCKER_TAG }}-${{ env.GRADLE_VERSION }}-21-debian.tar](${{ env.BASE_URL }}/gradle-loong64-${{ env.DOCKER_TAG }}-${{ env.GRADLE_VERSION }}-21-debian.tar) |
          | `gradle-loong64-${{ env.DOCKER_TAG }}-${{ env.GRADLE_VERSION }}-21-debian-slim.tar` | [gradle-loong64-${{ env.DOCKER_TAG }}-${{ env.GRADLE_VERSION }}-21-debian-slim.tar](${{ env.BASE_URL }}/gradle-loong64-${{ env.DOCKER_TAG }}-${{ env.GRADLE_VERSION }}-21-debian-slim.tar) |
          | `gradle-loong64-${{ env.DOCKER_TAG }}-${{ env.GRADLE_VERSION }}-25-anolis.tar` | [gradle-loong64-${{ env.DOCKER_TAG }}-${{ env.GRADLE_VERSION }}-25-anolis.tar](${{ env.BASE_URL }}/gradle-loong64-${{ env.DOCKER_TAG }}-${{ env.GRADLE_VERSION }}-25-anolis.tar) |
          | `gradle-loong64-${{ env.DOCKER_TAG }}-${{ env.GRADLE_VERSION }}-25-debian.tar` | [gradle-loong64-${{ env.DOCKER_TAG }}-${{ env.GRADLE_VERSION }}-25-debian.tar](${{ env.BASE_URL }}/gradle-loong64-${{ env.DOCKER_TAG }}-${{ env.GRADLE_VERSION }}-25-debian.tar) |
          | `gradle-loong64-${{ env.DOCKER_TAG }}-${{ env.GRADLE_VERSION }}-25-debian-slim.tar` | [gradle-loong64-${{ env.DOCKER_TAG }}-${{ env.GRADLE_VERSION }}-25-debian-slim.tar](${{ env.BASE_URL }}/gradle-loong64-${{ env.DOCKER_TAG }}-${{ env.GRADLE_VERSION }}-25-debian-slim.tar) |
          | `gradle-loong64-${{ env.DOCKER_TAG }}-${{ env.GRADLE_VERSION }}-26-anolis.tar` | [gradle-loong64-${{ env.DOCKER_TAG }}-${{ env.GRADLE_VERSION }}-26-anolis.tar](${{ env.BASE_URL }}/gradle-loong64-${{ env.DOCKER_TAG }}-${{ env.GRADLE_VERSION }}-26-anolis.tar) |
          | `gradle-loong64-${{ env.DOCKER_TAG }}-${{ env.GRADLE_VERSION }}-26-debian.tar` | [gradle-loong64-${{ env.DOCKER_TAG }}-${{ env.GRADLE_VERSION }}-26-debian.tar](${{ env.BASE_URL }}/gradle-loong64-${{ env.DOCKER_TAG }}-${{ env.GRADLE_VERSION }}-26-debian.tar) |
          | `gradle-loong64-${{ env.DOCKER_TAG }}-${{ env.GRADLE_VERSION }}-26-debian-slim.tar` | [gradle-loong64-${{ env.DOCKER_TAG }}-${{ env.GRADLE_VERSION }}-26-debian-slim.tar](${{ env.BASE_URL }}/gradle-loong64-${{ env.DOCKER_TAG }}-${{ env.GRADLE_VERSION }}-26-debian-slim.tar) |
          | `gradle-loong64-git-${{ env.DOCKER_TAG }}-${{ env.GRADLE_VERSION }}-8-anolis.tar` | [gradle-loong64-git-${{ env.DOCKER_TAG }}-${{ env.GRADLE_VERSION }}-8-anolis.tar](${{ env.BASE_URL }}/gradle-loong64-git-${{ env.DOCKER_TAG }}-${{ env.GRADLE_VERSION }}-8-anolis.tar) |
