          | `gradle-loong64-git-${{ env.DOCKER_TAG }}-${{ env.GRADLE_VERSION }}-8-debian-slim.tar` | [gradle-loong64-git-${{ env.DOCKER_TAG }}-${{ env.GRADLE_VERSION }}-8-debian-slim.tar](${{ env.BASE_URL }}/gradle-loong64-git-${{ env.DOCKER_TAG }}-${{ env.GRADLE_VERSION }}-8-debian-slim.tar) |
          | `gradle-loong64-git-${{ env.DOCKER_TAG }}-${{ env.GRADLE_VERSION }}-11-anolis.tar` | [gradle-loong64-git-${{ env.DOCKER_TAG }}-${{ env.GRADLE_VERSION }}-11-anolis.tar](${{ env.BASE_URL }}/gradle-loong64-git-${{ env.DOCKER_TAG }}-${{ env.GRADLE_VERSION }}-11-anolis.tar) |
          | `gradle-loong64-git-${{ env.DOCKER_TAG }}-${{ env.GRADLE_VERSION }}-11-debian.tar` | [gradle-loong64-git-${{ env.DOCKER_TAG }}-${{ env.GRADLE_VERSION }}-11-debian.tar](${{ env.BASE_URL }}/gradle-loong64-git-${{ env.DOCKER_TAG }}-${{ env.GRADLE_VERSION }}-11-debian.tar) |
          | `gradle-loong64-git-${{ env.DOCKER_TAG }}-${{ env.GRADLE_VERSION }}-11-debian-slim.tar` | [gradle-loong64-git-${{ env.DOCKER_TAG }}-${{ env.GRADLE_VERSION }}-11-debian-slim.tar](${{ env.BASE_URL }}/gradle-loong64-git-${{ env.DOCKER_TAG }}-${{ env.GRADLE_VERSION }}-11-debian-slim.tar) |
          | `gradle-loong64-git-${{ env.DOCKER_TAG }}-${{ env.GRADLE_VERSION }}-17-anolis.tar` | [gradle-loong64-git-${{ env.DOCKER_TAG }}-${{ env.GRADLE_VERSION }}-17-anolis.tar](${{ env.BASE_URL }}/gradle-loong64-git-${{ env.DOCKER_TAG }}-${{ env.GRADLE_VERSION }}-17-anolis.tar) |
          | `gradle-loong64-git-${{ env.DOCKER_TAG }}-${{ env.GRADLE_VERSION }}-17-debian.tar` | [gradle-loong64-git-${{ env.DOCKER_TAG }}-${{ env.GRADLE_VERSION }}-17-debian.tar](${{ env.BASE_URL }}/gradle-loong64-git-${{ env.DOCKER_TAG }}-${{ env.GRADLE_VERSION }}-17-debian.tar) |
          | `gradle-loong64-git-${{ env.DOCKER_TAG }}-${{ env.GRADLE_VERSION }}-17-debian-slim.tar` | [gradle-loong64-git-${{ env.DOCKER_TAG }}-${{ env.GRADLE_VERSION }}-17-debian-slim.tar](${{ env.BASE_URL }}/gradle-loong64-git-${{ env.DOCKER_TAG }}-${{ env.GRADLE_VERSION }}-17-debian-slim.tar) |
          | `gradle-loong64-git-${{ env.DOCKER_TAG }}-${{ env.GRADLE_VERSION }}-21-anolis.tar` | [gradle-loong64-git-${{ env.DOCKER_TAG }}-${{ env.GRADLE_VERSION }}-21-anolis.tar](${{ env.BASE_URL }}/gradle-loong64-git-${{ env.DOCKER_TAG }}-${{ env.GRADLE_VERSION }}-21-anolis.tar) |
          | `gradle-loong64-git-${{ env.DOCKER_TAG }}-${{ env.GRADLE_VERSION }}-21-debian.tar` | [gradle-loong64-git-${{ env.DOCKER_TAG }}-${{ env.GRADLE_VERSION }}-21-debian.tar](${{ env.BASE_URL }}/gradle-loong64-git-${{ env.DOCKER_TAG }}-${{ env.GRADLE_VERSION }}-21-debian.tar) |
          | `gradle-loong64-git-${{ env.DOCKER_TAG }}-${{ env.GRADLE_VERSION }}-21-debian-slim.tar` | [gradle-loong64-git-${{ env.DOCKER_TAG }}-${{ env.GRADLE_VERSION }}-21-debian-slim.tar](${{ env.BASE_URL }}/gradle-loong64-git-${{ env.DOCKER_TAG }}-${{ env.GRADLE_VERSION }}-21-debian-slim.tar) |
          | `gradle-loong64-git-${{ env.DOCKER_TAG }}-${{ env.GRADLE_VERSION }}-25-anolis.tar` | [gradle-loong64-git-${{ env.DOCKER_TAG }}-${{ env.GRADLE_VERSION }}-25-anolis.tar](${{ env.BASE_URL }}/gradle-loong64-git-${{ env.DOCKER_TAG }}-${{ env.GRADLE_VERSION }}-25-anolis.tar) |
          | `gradle-loong64-git-${{ env.DOCKER_TAG }}-${{ env.GRADLE_VERSION }}-25-debian.tar` | [gradle-loong64-git-${{ env.DOCKER_TAG }}-${{ env.GRADLE_VERSION }}-25-debian.tar](${{ env.BASE_URL }}/gradle-loong64-git-${{ env.DOCKER_TAG }}-${{ env.GRADLE_VERSION }}-25-debian.tar) |
